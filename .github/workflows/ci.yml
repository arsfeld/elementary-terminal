# This fork's CI, in place of elementary's (which builds against VTE, and
# runs elementary's release and translation machinery). Builds and tests on
# every push and pull request in elementary OS 8, against libghostty-gtk's
# latest release. A push to libghostty-gtk also publishes the .deb as a
# GitHub Release, which arsfeld/pantheon-apt picks up into the apt repo.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/elementary/docker:stable
    steps:
      # Before checkout: without git in the container, actions/checkout
      # downloads a tarball and the build cannot read the commit.
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates
      - uses: actions/checkout@v7
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build, test and package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ci/build-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/libghostty-gtk'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: deb
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          gh release create "deb/$version" ./*.deb \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$version" \
            --notes "Debian package for elementary OS 8 (noble, amd64), built from $GITHUB_SHA. Install it from the apt repo: https://arsfeld.github.io/pantheon-apt"
